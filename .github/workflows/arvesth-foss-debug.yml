name: ARVESTH FOSS Debug

on:
  push:
    branches:
      - arvesth/branding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARVESTH FOSS Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          METROLIST_APPLICATION_ID: com.arvesth.music
          METROLIST_APP_NAME: ARVESTH
        run: ./gradlew --no-daemon :app:assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARVESTH-FOSS-Debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
